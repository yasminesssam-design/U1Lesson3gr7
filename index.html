<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة محترف | الدرس الثالث: أنظمة التشغيل – Operating Systems</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef4fd;--card:#ffffff;--ink:#12263f;--muted:#46597a;--navy:#0f4c81;--orange:#f0a010;--blue:#3a78c9;
  --ok:#14883f;--okbg:#dff7e7;--bad:#cf2436;--badbg:#fde6e9;--line:#cfdcf0;--soft:#f5f9ff;--btn-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1626;--card:#15233a;--ink:#eaf1fc;--muted:#a9bad6;--navy:#5aa2ec;--orange:#f6b73c;--blue:#7db2f2;
    --ok:#4ddc84;--okbg:#12361f;--bad:#ff6b7a;--badbg:#3b1820;--line:#2a3d5e;--soft:#101d31;--btn-ink:#0c1626;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1626;--card:#15233a;--ink:#eaf1fc;--muted:#a9bad6;--navy:#5aa2ec;--orange:#f6b73c;--blue:#7db2f2;
  --ok:#4ddc84;--okbg:#12361f;--bad:#ff6b7a;--badbg:#3b1820;--line:#2a3d5e;--soft:#101d31;--btn-ink:#0c1626;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:21px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 60px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:3px solid var(--orange);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.logo-box{background:#fff;border-radius:14px;padding:2px;display:flex;flex:none}
.logo-box img{width:58px;height:58px;display:block}
.top-title{flex:1;min-width:0;line-height:1.25}
.top-title b{display:block;font-size:1.05rem;color:var(--navy)}
.top-title span{font-size:.85rem;color:var(--muted)}
.icon-btn{border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;font-size:1.3rem;width:50px;height:50px;flex:none}
.navdots{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;max-width:900px;margin:0 auto;-webkit-overflow-scrolling:touch}
.dot{flex:none;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem;white-space:nowrap}
.dot.on{background:var(--navy);color:var(--btn-ink);border-color:var(--navy)}
.dot.done{border-color:var(--ok)}
/* welcome */
.hero{background:var(--card);border-radius:28px;padding:26px 20px;text-align:center;box-shadow:0 8px 30px rgba(15,76,129,.15);margin-top:14px}
.hero .big-logo{background:#fff;border-radius:24px;display:inline-block;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.hero .big-logo img{width:170px;height:170px;display:block}
.hero h1{margin:14px 0 4px;font-size:2rem;color:var(--navy);line-height:1.3}
.hero h2{margin:0 0 14px;font-size:1.4rem;color:var(--orange)}
.hero p{margin:6px 0;color:var(--muted)}
.namebox{margin:18px auto 6px;max-width:520px}
.namebox label{display:block;font-weight:900;font-size:1.25rem;margin-bottom:8px}
.namebox input{width:100%;font-family:inherit;font-size:1.5rem;padding:14px 16px;border-radius:18px;border:3px solid var(--blue);background:var(--soft);color:var(--ink);text-align:center}
.namebox input:focus{outline:4px solid rgba(240,160,16,.5)}
.err{color:var(--bad);font-weight:700;min-height:1.6em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:20px;padding:14px 26px;font-size:1.3rem;font-weight:900;color:var(--btn-ink);background:var(--navy);box-shadow:0 5px 0 rgba(0,0,0,.2);min-height:60px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.or{background:var(--orange);color:#1b1200}
.btn.gr{background:var(--ok);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.block{display:flex;width:100%}
/* lesson cards */
.sec-head{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:24px;padding:18px 20px;margin:16px 0}
.sec-head .ic{font-size:2.6rem}
.sec-head h2{margin:0;font-size:1.6rem;line-height:1.3}
.sec-head small{display:block;font-size:1.05rem;opacity:.95}
.card{background:var(--card);border-radius:24px;padding:18px 20px;margin:14px 0;box-shadow:0 4px 18px rgba(15,76,129,.1);border:2px solid var(--line)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:1.35rem;color:var(--navy);margin:0 0 8px;line-height:1.4}
.sub .sl{color:var(--orange)}
.duo{margin:8px 0;border-radius:16px;overflow:hidden;border:2px solid var(--line)}
.duo p{margin:0;padding:10px 16px;font-size:1.25rem}
.duo .en{background:var(--soft);font-weight:500}
.duo .ar{background:var(--card);border-top:2px dashed var(--line);font-weight:700;color:var(--navy)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;font-size:1.15rem;line-height:1.4}
.chip .ci{font-size:2.2rem}
.chip b{display:block}
.chip span{display:block;color:var(--navy);font-weight:700;margin-top:2px}
.chip .num{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#1b1200;font-weight:900;align-items:center;justify-content:center;font-size:1.05rem;margin-bottom:4px}
.note{background:#fff7e2;border:2px dashed var(--orange);color:#4a3200;border-radius:18px;padding:12px 16px;margin:12px 0}
:root[data-theme="dark"] .note{background:#3a2c0d;color:#ffe2a3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note{background:#3a2c0d;color:#ffe2a3}}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-top:8px}
.term{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:1.1rem}
.term b{color:var(--ink)}.term span{color:var(--navy);font-weight:700;text-align:end}
.practice{background:linear-gradient(135deg,#fff3d1,#ffe0a0);border-radius:26px;padding:20px;margin:20px 0;text-align:center;border:3px solid var(--orange);color:#3a2600}
:root[data-theme="dark"] .practice{background:linear-gradient(135deg,#3b2d0d,#4a3810);color:#ffe9b8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .practice{background:linear-gradient(135deg,#3b2d0d,#4a3810);color:#ffe9b8}}
.practice h3{margin:0 0 4px;font-size:1.5rem}
.practice p{margin:0 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px;font-weight:900;color:var(--navy);font-size:1.15rem}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--ok));width:0;transition:width .4s}
.qcard{background:var(--card);border-radius:26px;padding:20px;margin:16px 0;border:3px solid var(--line);box-shadow:0 6px 22px rgba(15,76,129,.12)}
.qgroup{display:inline-block;background:var(--navy);color:var(--btn-ink);border-radius:999px;padding:2px 16px;font-size:1rem;font-weight:700;margin-bottom:10px}
.qtext{font-size:1.6rem;font-weight:900;line-height:1.6;margin:6px 0 16px}
.qtext u{text-decoration-thickness:4px;text-decoration-color:var(--orange);text-underline-offset:6px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;min-height:68px;padding:12px 18px;border-radius:20px;border:3px solid var(--line);background:var(--soft);color:var(--ink);font-size:1.4rem;font-weight:700;line-height:1.4;transition:transform .12s,background .2s}
.opt:hover{border-color:var(--blue)}
.opt .lt{flex:none;width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.ok .lt{background:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.no .lt{background:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:20px;padding:14px 18px;font-size:1.35rem;font-weight:900;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok);border:3px solid var(--ok)}
.fb.no{display:block;background:var(--badbg);color:var(--bad);border:3px solid var(--bad)}
.fb small{display:block;font-size:1.15rem;margin-top:4px;font-weight:700}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.popok{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;animation:fl .55s ease-out forwards}
.flash.bad{background:radial-gradient(circle,rgba(207,36,54,.05),rgba(207,36,54,.45))}
.flash.good{background:radial-gradient(circle,rgba(20,136,63,.05),rgba(20,136,63,.35))}
@keyframes fl{from{opacity:1}to{opacity:0}}
.bigemoji{position:fixed;left:50%;top:38%;font-size:6rem;transform:translate(-50%,-50%);z-index:61;pointer-events:none;animation:be .9s ease-out forwards}
@keyframes be{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.pc{position:fixed;top:-40px;font-size:30px;z-index:62;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.res{background:var(--card);border-radius:28px;padding:24px 18px;text-align:center;border:3px solid var(--orange);margin-top:16px}
.res .stars{font-size:2.6rem;letter-spacing:4px}
.res .score{font-size:3.4rem;font-weight:900;color:var(--navy);line-height:1.2}
.res .pct{font-size:1.6rem;font-weight:900;color:var(--orange)}
.res h2{margin:6px 0;font-size:1.7rem}
.acts{display:grid;gap:12px;margin-top:18px}
.mistakes{margin-top:16px;text-align:start}
.mistakes details{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.mistakes summary{font-weight:900;cursor:pointer;font-size:1.2rem}
.mi{border-top:2px dashed var(--line);padding:10px 0;font-size:1.1rem}
.mi .g{color:var(--ok);font-weight:700}.mi .r{color:var(--bad);font-weight:700}
.exam-btns{display:grid;gap:16px;margin-top:14px}
.exbtn{border:0;border-radius:26px;padding:22px 18px;color:#fff;text-align:center;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.22);font-size:1.6rem;line-height:1.4}
.exbtn small{display:block;font-size:1.1rem;font-weight:700;opacity:.95}
.exbtn.a{background:linear-gradient(135deg,#0f4c81,#3a78c9)}
.exbtn.e{background:linear-gradient(135deg,#d97e00,#f0a010);color:#1b1200}
.exbtn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.foot{text-align:center;color:var(--muted);font-size:.95rem;margin-top:30px}
@media (prefers-reduced-motion: reduce){.shake,.popok,.pc,.bigemoji{animation-duration:.01s}}
</style>
</head>

const FINAL=SECS.length; // index of final exam page

function setNav(){
  const n=$('#nav');
  if(!studentName){n.style.display='none';return}
  n.style.display='flex';
  let h='';
  SECS.forEach((s,i)=>{h+=`<button class="dot ${cur===i?'on':''} ${seen.has(i)?'done':''}" data-i="${i}">${s.ic} ${i+1}</button>`});
  h+=`<button class="dot ${cur===FINAL?'on':''}" data-i="${FINAL}">📝 ${'الاختبار · Exam'}</button>`;
  n.innerHTML=h;
  n.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{sClick();go(+b.dataset.i)});
  const on=n.querySelector('.dot.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}

   <p>درس تفاعلي بالعربية والإنجليزية مع أسئلة واختبار نهائي<br><span dir="ltr">Interactive bilingual lesson with quizzes and a final exam</span></p>
   <div class="namebox"><label for="nm">✍️ اكتب اسمك أولًا · Write your name first</label>
   <input id="nm" type="text" autocomplete="name" maxlength="60" placeholder="اسم الطالب · Student name" value="${studentName.replace(/"/g,'&quot;')}">
   <div class="err" id="err"></div></div>
   <button class="btn or" id="go">🚀 ابدأ الدرس · Start the lesson</button></section>`;
  const start=()=>{const v=$('#nm').value.trim();if(v.length<2){$('#err').textContent='من فضلك اكتب اسمك · Please write your name';sNo();$('#nm').focus();return}
    studentName=v;ac();sOk();$('#who').textContent='👤 '+studentName;go(0)};
  $('#go').onclick=start;$('#nm').onkeydown=e=>{if(e.key==='Enter')start()};
}
function go(i){
  cur=i;window.scrollTo({top:0,behavior:'smooth'});setNav();
  if(i===FINAL){finalPage();return}
  seen.add(i);setNav();
  const s=SECS[i];
  $('#app').innerHTML=`<div class="sec-head"><div class="ic">${s.ic}</div><div><h2 dir="ltr">${i+1}. ${s.en}</h2><small dir="rtl">${s.ar}</small></div></div>
  ${s.html()}
  <div class="practice"><h3>🧠 اختبر نفسك في هذا الجزء · Test yourself on this part</h3><p>5 أسئلة من أسئلة الملفات · 5 questions from the book</p>
   <div class="two"><button class="btn block" id="qa">🇪🇬 أسئلة بالعربي (5)</button><button class="btn or block" id="qe">🇬🇧 English Questions (5)</button></div></div>
  <div class="pager"><button class="btn ghost" id="pv" ${i===0?'disabled style="opacity:.4"':''}>◀ السابق · Back</button><button class="btn gr" id="nx">${i===SECS.length-1?'📝 الاختبار النهائي · Final exam':'التالي · Next ▶'}</button></div>`;
  $('#qa').onclick=()=>{ac();sClick();startQuiz('ar',SQ.ar[i].map(id=>Object.assign({id},AR[id])),{title:`${s.ar} — أسئلة`,mode:'sec',sec:i})};
  $('#qe').onclick=()=>{ac();sClick();startQuiz('en',SQ.en[i].map(id=>Object.assign({id},EN[id])),{title:`${s.en} — Quiz`,mode:'sec',sec:i})};
  $('#pv').onclick=()=>{if(i>0)go(i-1)};
  $('#nx').onclick=()=>{sClick();go(i+1)};
}
function finalPage(){
  $('#app').innerHTML=`<div class="sec-head"><div class="ic">📝</div><div><h2>الاختبار النهائي · Final Exam</h2><small>${studentName}، اختر لغة الاختبار · choose the exam language</small></div></div>
  <div class="card"><p style="margin:0">الاختبار يضم <b>كل الأسئلة</b> الموجودة في الملفين، وفي النهاية يمكنك إرسال نتيجتك إلى واتساب.<br><span dir="ltr">The exam contains <b>all the questions</b> in the two files. At the end you can send your result to WhatsApp.</span></p></div>
  <div class="exam-btns">
   <button class="exbtn a" id="ea">📘 اختبار باللغة العربية<small>${examList('ar').length} سؤال · بنفس اختيارات الملف العربي</small></button>
   <button class="exbtn e" id="ee">📗 English Exam<small>${examList('en').length} questions · same options as the English file</small></button>
  </div>
  <div class="pager" style="margin-top:22px"><button class="btn ghost" id="pv">◀ الرجوع للدرس · Back</button></div>`;
  $('#ea').onclick=()=>{ac();sClick();startQuiz('ar',examList('ar'),{title:'الاختبار النهائي — عربي',mode:'exam'})};
  $('#ee').onclick=()=>{ac();sClick();startQuiz('en',examList('en'),{title:'Final Exam — English',mode:'exam'})};
  $('#pv').onclick=()=>go(FINAL-1);
}

/* ============ quiz engine ============ */
let Q=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(lang,list,meta){Q={lang,list,i:0,score:0,wrong:[],meta,done:false};window.scrollTo({top:0});renderQ()}
function renderQ(){
  const {lang,list,i,meta}=Q,it=list[i],ar=lang==='ar';
  let opts=it.o.map((t,k)=>({t,ok:k===it.a}));if(it.sh)opts=shuffle(opts);
  Q.cur={it,opts,answered:false};
  const L=ar?['أ','ب','ج','د','هـ','و','ز']:['a','b','c','d','e','f','g'];
  const pct=Math.round(i/list.length*100);
  $('#app').innerHTML=`<div dir="${ar?'rtl':'ltr'}">
   <div class="qhead"><span>${meta.title}</span><span>${ar?'سؤال':'Question'} ${i+1} / ${list.length}</span></div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="qcard" id="qc">
     ${meta.mode==='exam'?`<div class="qgroup">${it.g}</div>`:''}
     <div class="qtext">${it.q}</div>
     <div class="opts" id="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="lt">${it.tf?(k===0?'✓':'✗'):L[k]}</span><span>${o.t}</span></button>`).join('')}</div>
     <div class="fb" id="fb"></div>
   </div>
   <div class="two" style="margin-top:8px"><button class="btn ghost" id="quit">${ar?'⬅ خروج':'⬅ Exit'}</button><button class="btn gr" id="next" style="visibility:hidden">${i===list.length-1?(ar?'🏁 النتيجة':'🏁 Result'):(ar?'السؤال التالي ➡':'Next ➡')}</button></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#next').onclick=()=>{sClick();Q.i++;if(Q.i>=Q.list.length)finish();else{renderQ();window.scrollTo({top:0})}};
  $('#quit').onclick=()=>{if(Q.meta.mode==='sec')go(Q.meta.sec);else go(FINAL)};
}
const PR={ar:['أحسنت! 🎉','ممتاز! ⭐','رائع جدًا! 👏','إجابة صحيحة! 🌟','برافو عليك! 🏆'],en:['Great job! 🎉','Excellent! ⭐','Awesome! 👏','Correct! 🌟','Well done! 🏆']};
function pick(k){
  const c=Q.cur;if(c.answered)return;c.answered=true;
  const ar=Q.lang==='ar',good=c.opts[k].ok,btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,j)=>{b.disabled=true;if(c.opts[j].ok)b.classList.add('ok');else if(j===k)b.classList.add('no')});
  const fb=$('#fb'),qc=$('#qc'),right=c.opts.find(o=>o.ok).t;
  if(good){Q.score++;sOk();fx(true);qc.classList.add('popok');fb.className='fb ok';fb.innerHTML=PR[Q.lang][Math.floor(Math.random()*5)]}
  else{sNo();fx(false);qc.classList.add('shake');fb.className='fb no';fb.innerHTML=(ar?'إجابة خاطئة ❌':'Not quite ❌')+`<small>${ar?'الإجابة الصحيحة:':'Correct answer:'} ${right}</small>`;
    Q.wrong.push({n:Q.i+1,q:c.it.q.replace(/<[^>]+>/g,''),chosen:c.opts[k].t,right})}
  const nx=$('#next');nx.style.visibility='visible';setTimeout(()=>{try{nx.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}},350);
}
function finish(){
  const {lang,list,score,wrong,meta}=Q,ar=lang==='ar',tot=list.length,pct=Math.round(score/tot*100);
  const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';
  const msg=pct>=90?(ar?'ممتاز! أنت محترف حقًا 🏆':'Excellent! You are a real pro 🏆'):pct>=70?(ar?'جيد جدًا! استمر 👏':'Very good! Keep going 👏'):pct>=50?(ar?'جيد، راجع الأخطاء وحاول مرة أخرى 📖':'Good — review your mistakes and try again 📖'):(ar?'لا تقلق! راجع الدرس وحاول مرة أخرى 💪':'Don\'t worry! Review the lesson and try again 💪');
  pct>=50?(sWin(),confettiBig()):sNo();
  let extra='';
  const mist=wrong.length?`<div class="mistakes"><details><summary>${ar?'📖 مراجعة الأخطاء':'📖 Review mistakes'} (${wrong.length})</summary>${wrong.map(w=>`<div class="mi"><b>${w.n}.</b> ${w.q}<br><span class="r">${ar?'إجابتك':'Your answer'}: ${w.chosen}</span><br><span class="g">${ar?'الصحيحة':'Correct'}: ${w.right}</span></div>`).join('')}</details></div>`:'';
  let acts='';
  if(meta.mode==='exam'){
    const txt=waText(lang,score,tot,pct,wrong);
    const url='https://wa.me/'+WA+'?text='+encodeURIComponent(txt);
    acts=`<a class="btn gr block" style="text-decoration:none" href="${url}" target="_blank" rel="noopener" id="wa">${ar?'📲 إرسال النتيجة إلى واتساب':'📲 Send result to WhatsApp'}</a>
      <button class="btn ghost block" id="cp">${ar?'📋 نسخ النتيجة':'📋 Copy result'}</button>
      <button class="btn block" id="rt">${ar?'🔄 إعادة الاختبار':'🔄 Retry exam'}</button>
      <button class="btn ghost block" id="bk">${ar?'⬅ رجوع':'⬅ Back'}</button>`;
    extra=`<p style="color:var(--muted);font-size:1rem">${ar?'سيفتح واتساب برسالة جاهزة، اضغط "إرسال" لتصل النتيجة.':'WhatsApp will open with a ready message — press "Send" so the result reaches the teacher.'}</p>`;
    $('#app').innerHTML=`<div dir="${ar?'rtl':'ltr'}"><div class="res"><div class="stars">${stars}</div><h2>${studentName}</h2><div class="score">${score} / ${tot}</div><div class="pct">${pct}%</div><h2>${msg}</h2>${extra}<div class="acts">${acts}</div>${mist}</div></div>`;
    $('#cp').onclick=()=>{try{navigator.clipboard.writeText(txt);$('#cp').textContent=ar?'✅ تم النسخ':'✅ Copied'}catch(e){window.prompt('Copy:',txt)}};
    $('#rt').onclick=()=>startQuiz(lang,examList(lang),meta);
    $('#bk').onclick=()=>go(FINAL);
  }else{
    const nxtLang=ar?'en':'ar';
    acts=`<button class="btn block" id="rt">${ar?'🔄 حاول مرة أخرى':'🔄 Try again'}</button>
      <button class="btn or block" id="ol">${ar?'🇬🇧 جرّب أسئلة الإنجليزية':'🇪🇬 جرّب أسئلة العربي'}</button>
      <button class="btn gr block" id="cn">${meta.sec===SECS.length-1?(ar?'📝 الاختبار النهائي':'📝 Final exam'):(ar?'الجزء التالي ➡':'Next part ➡')}</button>
      <button class="btn ghost block" id="bk">${ar?'📖 العودة للشرح':'📖 Back to lesson'}</button>`;
    $('#app').innerHTML=`<div dir="${ar?'rtl':'ltr'}"><div class="res"><div class="stars">${stars}</div><h2>${studentName}</h2><div class="score">${score} / ${tot}</div><div class="pct">${pct}%</div><h2>${msg}</h2><div class="acts">${acts}</div>${mist}</div></div>`;
    const s=meta.sec;
    $('#rt').onclick=()=>startQuiz(lang,SQ[lang][s].map(id=>Object.assign({id},(lang==='ar'?AR:EN)[id])),meta);
    $('#ol').onclick=()=>{const nl=nxtLang,D=nl==='ar'?AR:EN;startQuiz(nl,SQ[nl][s].map(id=>Object.assign({id},D[id])),{title:nl==='ar'?SECS[s].ar+' — أسئلة':SECS[s].en+' — Quiz',mode:'sec',sec:s})};
    $('#cn').onclick=()=>go(s+1);
    $('#bk').onclick=()=>go(s);
  }
  window.scrollTo({top:0});
}
function waText(lang,score,tot,pct,wrong){
  const ar=lang==='ar',nums=wrong.map(w=>w.n).join('، ');
  if(ar)return `منصة محترف by a2zlearn 🎓
الدرس الثالث: أنظمة التشغيل — الصف الأول الإعدادي
👤 اسم الطالب: ${studentName}
📘 الاختبار: باللغة العربية
✅ النتيجة: ${score} من ${tot} (${pct}%)
❌ عدد الأخطاء: ${wrong.length}${wrong.length?'\nأرقام الأسئلة الخطأ: '+nums:''}`;
  return `Mohtarf by a2zlearn 🎓
Lesson 3: Operating Systems — Grade 1 Prep
👤 Student name: ${studentName}
📗 Exam: English
✅ Score: ${score} out of ${tot} (${pct}%)
❌ Mistakes: ${wrong.length}${wrong.length?'\nWrong question numbers: '+wrong.map(w=>w.n).join(', '):''}`;
}

welcome();
</script>
